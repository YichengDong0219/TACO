# taco -- the environment the RoboTwin-12 campaign was actually run in.
#
# Exported on the 4090 cluster with:
#     conda env export -n taco --no-builds
# The exporting machine's `prefix:` line is stripped.
#
# THREE PACKAGES ARE DELIBERATELY ABSENT from the pip list below, because they
# are editable installs into this repository rather than releases:
#
#     lerobot       -> third_party/lerobot/src        (carries the PI0.5
#                      preprocessing patch; the PyPI wheel does NOT, and an
#                      unpatched lerobot silently degrades every result)
#     transformers  -> third_party/lerobot/src/transformers/src
#     cfn           -> cfn/
#
# Recreating the environment therefore takes two steps:
#     vendor/bootstrap.sh env        # conda env create + the editable installs
#
# and `vendor/bootstrap.sh check` verifies the patches actually landed.
#
# The removed entries were: - cfn==0.1.0, - lerobot==0.3.4, - transformers==4.53.2
name: taco
channels:
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/pytorch/
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/main/
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/cloud/conda-forge/
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/free/
  - https://mirrors.tuna.tsinghua.edu.cn/anaconda/pkgs/r/
  - defaults
